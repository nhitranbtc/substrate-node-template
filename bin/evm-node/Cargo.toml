[package]
name = "evm-node"
version = "3.0.0"
authors.workspace = true
description = "Generic Substrate node implementation in Rust. (polkadot v1.15.0)"
build = "build.rs"
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
default-run = "evm-node"
homepage = "https://substrate.io"
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# `wasm-opt` has some problems on linux, see
# https://github.com/rustwasm/wasm-pack/issues/781 etc.
wasm-opt = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[badges]
maintenance = { status = "actively-developed" }
is-it-maintained-issue-resolution = { repository = "paritytech/polkadot-sdk" }
is-it-maintained-open-issues = { repository = "paritytech/polkadot-sdk" }

[[bin]]
name = "evm-node"
path = "bin/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# third-party dependencies
async-trait = { workspace = true }
hex-literal = { workspace = true }
array-bytes = { workspace = true, default-features = true }
clap = { features = ["derive"], optional = true, workspace = true }
codec = { workspace = true, default-features = true }
serde = { features = ["derive"], workspace = true, default-features = true }
jsonrpsee = { features = ["server"], workspace = true }
futures = { workspace = true }
log = { workspace = true, default-features = true }
rand = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
tokio = { workspace = true }
polkadot-sdk = { features = [
    "node",
], workspace = true, default-features = true }
evm-node-runtime.workspace = true
node-primitives.workspace = true
node-primitives.default-features = true
node-inspect = { optional = true, workspace = true, default-features = true }

# primitives
sp-api = { workspace = true, features = ["std"] }
sp-block-builder = { workspace = true, features = ["std"] }
sp-consensus-aura = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-genesis-builder = { workspace = true, features = ["std"] }
sp-inherents = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
sp-offchain = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-session = { workspace = true, features = ["std"] }
sp-transaction-pool = { workspace = true, features = ["std"] }

frame-support = { workspace = true }
sp-blockchain = { workspace = true }
sp-consensus = { workspace = true }
sp-keyring = { workspace = true, optional = true }
sp-keystore = { workspace = true }
sp-std = { workspace = true }
sp-timestamp = { workspace = true }
sp-trie = { workspace = true }
sp-version = { workspace = true }

# client dependencies
sc-basic-authorship = { workspace = true }
sc-chain-spec = { workspace = true }
sc-client-api = { workspace = true }
sc-client-db = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-aura = { workspace = true }
sc-consensus-babe = { workspace = true }
sc-consensus-grandpa = { workspace = true }
sc-consensus-manual-seal = { workspace = true, optional = true }
sc-executor = { workspace = true }
sc-network = { workspace = true }
sc-network-sync = { workspace = true }
sc-offchain = { workspace = true }
sc-rpc = { workspace = true }
sc-service = { workspace = true }
sc-sysinfo = { workspace = true }
sc-telemetry = { workspace = true }
sc-tracing = { workspace = true }
sc-transaction-pool = { workspace = true }
sc-transaction-pool-api = { workspace = true }
substrate-prometheus-endpoint = { workspace = true }

# Frontier
fc-api = { workspace = true }
fc-cli = { workspace = true }
fc-consensus = { workspace = true }
fc-db = { workspace = true }
fc-mapping-sync = { workspace = true }
fc-rpc = { workspace = true }
fc-rpc-core = { workspace = true }
fc-storage = { workspace = true }
fp-account = { workspace = true }
fp-dynamic-fee = { workspace = true, features = ["default"] }
fp-evm = { workspace = true, features = ["default"] }
fp-rpc = { workspace = true, features = ["default"] }

# frame dependencies
frame-metadata-hash-extension = { workspace = true }
frame-system = { workspace = true, features = ["std"] }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
substrate-frame-rpc-system = { workspace = true }


# # evm-tracing
# moonbeam-rpc-primitives-debug = { workspace = true }
# moonbeam-rpc-primitives-txpool = { workspace = true }

# moonbeam-primitives-ext = { workspace = true }
# moonbeam-rpc-debug = { workspace = true }
# moonbeam-rpc-trace = { workspace = true }
# moonbeam-rpc-txpool = { workspace = true }


[dev-dependencies]
futures = { workspace = true }
tempfile = { workspace = true }
assert_cmd = { workspace = true }
nix = { features = ["signal"], workspace = true }
regex = { workspace = true }
platforms = { workspace = true }
soketto = { workspace = true }
criterion = { features = [
    "async_tokio",
], workspace = true, default-features = true }
tokio = { features = [
    "macros",
    "parking_lot",
    "time",
], workspace = true, default-features = true }
tokio-util = { features = ["compat"], workspace = true }
wait-timeout = { workspace = true }
wat = { workspace = true }
serde_json = { workspace = true, default-features = true }
scale-info = { features = [
    "derive",
    "serde",
], workspace = true, default-features = true }

# These testing-only dependencies are not exported by the Polkadot-SDK crate:
# node-testing = { path = "../testing" }
# substrate-cli-test-utils = { path = "../../../test-utils/cli" }
sc-service-test = { workspace = true }


[build-dependencies]
clap = { optional = true, workspace = true }
clap_complete = { optional = true, workspace = true }
node-inspect = { optional = true, workspace = true, default-features = true }
sc-service = { workspace = true, optional = true }

polkadot-sdk = { features = [
    "frame-benchmarking-cli",
    "sc-cli",
    "sc-storage-monitor",
    "substrate-build-script-utils",
], optional = true, workspace = true, default-features = true }

[features]
default = [
    "clap",
    "clap_complete",
    "node-inspect",
    "polkadot-sdk",
    "sc-service/rocksdb",
]


runtime-benchmarks = [
    "evm-node-runtime/runtime-benchmarks",
    "node-inspect?/runtime-benchmarks",
    "polkadot-sdk/runtime-benchmarks",
]
try-runtime = ["evm-node-runtime/try-runtime", "polkadot-sdk/try-runtime"]
