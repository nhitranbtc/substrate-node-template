[package]
name = "evm-node-runtime"
version = "3.0.0"
authors.workspace = true
description = "Substrate node kitchensink runtime. (polkadot v1.15.0)"
edition.workspace = true
build = "build.rs"
license = "Apache-2.0"
homepage = "https://substrate.io"
repository.workspace = true
publish = false


[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]


[dependencies]

# third-party dependencies
codec = { features = ["derive", "max-encoded-len"], workspace = true }
scale-info = { features = ["derive", "serde"], workspace = true }
static_assertions = { workspace = true, default-features = true }
log = { workspace = true }
serde_json = { features = ["alloc", "arbitrary_precision"], workspace = true }

# pallet-asset-conversion: turn on "num-traits" feature
primitive-types = { features = [
	"codec",
	"num-traits",
	"scale-info",
], workspace = true }
polkadot-sdk = { features = ["runtime", "tuples-96"], workspace = true }

# Substrate
# (wasm)

sp-core = { workspace = true }

# Local Dependencies
node-primitives = { workspace = true }

# Frontier
fp-account = { workspace = true, features = ["serde"] }
fp-evm = { workspace = true }
fp-rpc = { workspace = true }
fp-self-contained = { workspace = true, features = ["serde"] }

pallet-base-fee = { workspace = true }
pallet-dynamic-fee = { workspace = true }
pallet-ethereum = { workspace = true, features = ["forbid-evm-reentrancy"] }
pallet-evm = { workspace = true, features = ["forbid-evm-reentrancy"] }
pallet-evm-chain-id = { workspace = true }
pallet-evm-precompile-blake2 = { workspace = true }
pallet-evm-precompile-bn128 = { workspace = true }
pallet-evm-precompile-dispatch = { workspace = true }
pallet-evm-precompile-modexp = { workspace = true }
pallet-evm-precompile-sha3fips = { workspace = true }
pallet-evm-precompile-simple = { workspace = true }

pallet-grandpa = { workspace = true }

# pallet-evm-precompile-storage-cleaner = { workspace = true }
precompile-utils = { workspace = true }


[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[features]
default = ["std"]
with-tracing = ["polkadot-sdk/with-tracing"]
std = [
	"codec/std",
	"log/std",
	"node-primitives/std",
	"polkadot-sdk/std",
	"scale-info/std",
	"serde_json/std",
	"substrate-wasm-builder",

	"fp-evm/std",
	"fp-rpc/std",
	"fp-self-contained/std",

	# Substrate
	"sp-core/std",

	# Frontier FRAME
	"pallet-base-fee/std",
	"pallet-dynamic-fee/std",

	"pallet-evm-chain-id/std",
	"pallet-ethereum/std",
	# "pallet-evm-precompile-author-mapping/std",
	# "pallet-evm-precompile-balances-erc20/std",
	# "pallet-evm-precompile-batch/std",
	# "pallet-evm-precompile-call-permit/std",
	# "pallet-evm-precompile-collective/std",
	# "pallet-evm-precompile-conviction-voting/std",

	# "pallet-evm-precompile-preimage/std",
	# "pallet-evm-precompile-randomness/std",
	# "pallet-evm-precompile-referenda/std",
	# "pallet-evm-precompile-registry/std",
	# "pallet-evm-precompileset-assets-erc20/std",
	# "pallet-evm-precompile-storage-cleaner/std",
	# "pallet-evm-precompile-p256verify/std",
	"pallet-evm/std",
	"pallet-grandpa/std",

	"precompile-utils/std",


]
runtime-benchmarks = ["polkadot-sdk/runtime-benchmarks"]
try-runtime = ["polkadot-sdk/try-runtime"]

metadata-hash = ["substrate-wasm-builder/metadata-hash"]
